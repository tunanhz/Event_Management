name: PR Checks

# Cổng chất lượng tự động cho mọi Pull Request nhắm vào develop.
# Fail bất kỳ job blocking nào -> branch protection chặn merge.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

# Hủy run cũ khi có commit mới trên cùng PR (tiết kiệm CI)
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Build (next build)
        # fetch mặc định uncached ở Next 16 -> page data là dynamic, không cần backend lúc build
        env:
          API_BASE_URL: http://localhost:5000
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build

  security:
    name: Security scan (secrets · deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks cần full history để quét commit trong PR

      # Quét lộ secret (API key, mật khẩu, token, .env...) — BLOCKING
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Kiểm tra lỗ hổng dependency — report-only (nhiều advisory upstream không fix được,
      # không nên chặn merge). Xem log để nắm mức độ.
      - name: Dependency audit (backend)
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Dependency audit (frontend)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
